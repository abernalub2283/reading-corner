<!DOCTYPE html>
<html>
    <head>
        <title>Reading Corner</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>Welcome to the Reading Corner</h1>
        <div id="shelves" class="shelf"></div>
        <script>
            const books = [
                {id: "annie", title: "Annie Knows Everything", author: "Rachel Woods", shelf: "Reading"},
                {id: "shadow", title: "Shadow Thief", author: "Eva Chase", shelf: "Reading"},
                {id: "king", title: "King of Battle and Blood", author: "Scarlett St Clair", shelf: "TBR"}
            ];

            const shelves = [
                {id: "wishlist", label: "Wishlist"},
                {id: "TBR", label: "TBR"},
                {id: "Reading", label: "Reading"},
                {id: "Finished", label: "Finished"}
            ]

            const shelvesDiv = document.getElementById('shelves');

            function bookCard(book) {
                return `
                    <div class="book-card" data-id="${book.id}">
                        <h3>${book.title}</h3>
                        <p>${book.author}</p>
                        <div class="stars">
                            <span data-value="1">★</span>
                            <span data-value="2">★</span>
                            <span data-value="3">★</span>
                            <span data-value="4">★</span>
                            <span data-value="5">★</span>
                        </div>
                    </div>
                `;
            }

            function renderBooks() {
                shelvesDiv.innerHTML = shelves.map (shelf => `
                    <section class="shelf">
                        <h2>${shelf.label}</h2>
                        <div class="cards">
                        ${books.filter(book => book.shelf === shelf.id).map(bookCard).join('')}
                        </div>
                    </section>
                `).join('');
            }

            renderBooks();

            let ratings = JSON.parse(localStorage.getItem('cornerRatings')) || {};

            shelvesDiv.addEventListener('click', function(event) {
                if (!event.target.matches('.stars span')) return;
                const card = event.target.closest('.book-card');
                const id = card.dataset.id;
                ratings[id] = parseInt(event.target.dataset.value);
                localStorage.setItem('cornerRatings', JSON.stringify(ratings));
                updateStars();
            });

            function updateStars () {
                document.querySelectorAll('.book-card').forEach(function(card) {
                    const rating = ratings[card.dataset.id] || 0;
                    card.querySelectorAll('.stars span').forEach(function(star) {
                        star.classList.toggle('lit', parseInt(star.dataset.value) <= rating);
                    });
                })
            }

            updateStars();
        </script>
    </body>
</html>
