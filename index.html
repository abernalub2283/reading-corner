<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Reading Corner</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>Welcome to the Reading Corner</h1>
        <div class="progress-wrap">
            <p id="progress-text"></p>
            <div class="progress-bar">
                <div id="progress-fill"></div>
            </div>
        </div>
        <form id="add-book>
            <h2>Add a Book</h2>
            <inpput id="new-title" placeholder="Title">
            <input id="new-author" placeholder="Author">
            <select id="new-shelf"></select>
            <button type="submit">Add Book</button>
            </form>
        <div id="shelves"></div>
        <script>
           const tracker = document.querySelector('.tracker');
            const progressFill = document.querySelector('.progress-fill');
            const progressText = document.querySelector('.progress-text');
            const totalRows = 28;

            let doneRows = JSON.parse(localStorage.getItem('wispRows')) || [];

            for (let i = 1; i <= totalRows; i++) {
                const box = document.createElement('div');
                box.className = 'row-box';
                box.textContent = i;
                if (doneRows.includes(i)) box.classList.add('done');
                tracker.appendChild(box);
            }

            tracker.addEventListener('click', function(event) {
                if (!event.target.matches('.row-box')) return;
                const row = parseInt(event.target.textContent);
                event.target.classList.toggle('done');
                if (doneRows.includes(row)) {
                    doneRows = doneRows.filter(r => r !== row);
                } else {
                    doneRows.push(row);
                }
                localStorage.setItem('wispRows', JSON.stringify(doneRows));
                updateProgress();
            });

            function updateProgress() {
                const done = doneRows.length;
                const percent = Math.round(done / totalRows * 100);
                progressFill.style.width = percent + '%';
                progressText.textContent = done + ' of ' + totalRows + ' rows done';
            }

            updateProgress();

        </script>
    </body>
</html>
